name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements-dev.txt shellcheck-py
      - run: ruff check .
      - run: python -m pytest -q --cov=bot --cov-fail-under=88
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: DOMAIN=bot.example.com docker compose --profile https config -q
      - run: docker build -t course-sales-bot:ci .
